<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paneles · Steelframing y Drywall</title>
<style>
:root{--bg:#17161a;--card:#222126;--tx:#eeedf0;--mut:#9b99a3;--bd:#38363f;--ac:#a58bf0;--acx:#17161a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--bd:#dcdad3;--ac:#5b3fa6;--acx:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;font:inherit;font-weight:600;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:12px;padding:10px 8px}
nav button[aria-selected="true"]{background:var(--ac);border-color:var(--ac);color:var(--acx)}
iframe{flex:1;min-height:0;width:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
</style></head><body>
<nav role="tablist">
<button role="tab" data-t="steel" aria-selected="true">Steelframing</button>
<button role="tab" data-t="drywall" aria-selected="false">Drywall</button>
</nav>
<iframe id="steel" title="Panel steelframing" src="steel.html"></iframe>
<iframe id="drywall" title="Panel drywall" data-src="drywall.html"></iframe>
<script>
const tabs=[...document.querySelectorAll('nav button')];
function show(t){
if(t!=='drywall')t='steel';
tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
for(const id of['steel','drywall']){
const f=document.getElementById(id);
if(id===t){if(!f.src&&f.dataset.src)f.src=f.dataset.src;f.classList.add('on')}else f.classList.remove('on')}
try{history.replaceState(null,'','#'+t)}catch(e){}}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script></body></html>
